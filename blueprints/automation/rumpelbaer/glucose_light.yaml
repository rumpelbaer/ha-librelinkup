blueprint:
  name: LibreLinkUp Glucose Light
  description: >
    Visual orientation only: colours an RGB light according to a LibreLinkUp
    glucose sensor. Thresholds, colours, brightness and activation conditions
    are configurable. The normal range can alternatively be shown as a colour
    temperature, which suits lights with a dedicated white channel.


    Not a medical device. Never use the colour of a lamp for treatment,
    dosing or any other medical decision, and always check the glucose value
    and the sensor itself in the LibreLinkUp app.


    A glucose light makes health information visible to everyone in the room,
    including guests. Choose the location accordingly.


    Thresholds are entered in mmol/L. The automation reads the unit of the
    glucose entity and converts a mg/dL reading before comparing, so switching
    the entity's display unit does not change how it behaves. If the unit is
    neither mmol/L nor mg/dL, the light shows the stale colour instead of
    guessing a glucose range.
  domain: automation

  input:
    glucose_sensor:
      name: Glucose sensor
      description: LibreLinkUp glucose entity. Both mmol/L and mg/dL work.
      selector:
        entity:
          domain: sensor
          device_class: blood_glucose_concentration

    stale_sensor:
      name: Data stale sensor
      description: LibreLinkUp Data Stale binary sensor of the same person.
      selector:
        entity:
          domain: binary_sensor

    target_light:
      name: Target light
      description: >
        Dimmable light used to visualize the glucose state. Every range outside
        normal uses an RGB colour, so the light has to be RGB-capable.
      selector:
        target:
          entity:
            domain: light

    very_low_threshold:
      name: Very low threshold
      description: Values below this threshold are shown in the very low color.
      default: 3.0
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    low_threshold:
      name: Low threshold
      description: Values below this threshold are shown in the low color.
      default: 3.9
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    high_threshold:
      name: High threshold
      description: Values up to this threshold are shown in the normal color.
      default: 10.0
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    very_high_threshold:
      name: Very high threshold
      description: Values above the high threshold up to this value use the high color. Higher values use the very high color.
      default: 13.9
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    very_low_color:
      name: Very low color
      default: [205, 75, 65]
      selector:
        color_rgb:

    low_color:
      name: Low color
      default: [235, 165, 45]
      selector:
        color_rgb:

    normal_color_mode:
      name: Normal - display style
      description: >
        How the normal range is shown: as an RGB colour, or as a colour
        temperature. Colour temperature suits lights with a white channel,
        which render warm white more naturally than an RGB mix. Every other
        range always uses its RGB colour.
      default: rgb
      selector:
        select:
          options:
            - rgb
            - color_temp

    normal_color:
      name: Normal - RGB color
      description: Used when the normal display style is "rgb".
      default: [255, 180, 110]
      selector:
        color_rgb:

    normal_color_temp_kelvin:
      name: Normal - color temperature
      description: Used when the normal display style is "color_temp".
      default: 2700
      selector:
        number:
          min: 2200
          max: 4000
          step: 50
          unit_of_measurement: K
          mode: slider

    high_color:
      name: High color
      default: [120, 140, 210]
      selector:
        color_rgb:

    very_high_color:
      name: Very high color
      default: [95, 70, 160]
      selector:
        color_rgb:

    stale_color:
      name: Stale, unknown or unusable color
      description: >
        Used when the reading is stale or unavailable, and whenever the glucose
        value cannot be classified - for example because the entity reports an
        unexpected unit. Never a glucose range.
      default: [115, 110, 120]
      selector:
        color_rgb:

    very_low_brightness:
      name: Very low brightness
      default: 75
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    low_brightness:
      name: Low brightness
      default: 70
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    normal_brightness:
      name: Normal brightness
      default: 60
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    high_brightness:
      name: High brightness
      default: 70
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    very_high_brightness:
      name: Very high brightness
      default: 75
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    stale_brightness:
      name: Stale, unknown or unusable brightness
      default: 45
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    activation_mode:
      name: Activation mode
      description: >
        Choose when the glucose light should be active.
        Presence modes are active when at least one selected person is home.
      default: always
      selector:
        select:
          options:
            - always
            - time
            - presence
            - time_and_presence
            - time_or_presence

    active_start_time:
      name: Active from
      description: Start of the active time window.
      default: "07:00:00"
      selector:
        time:

    active_end_time:
      name: Active until
      description: >
        End of the active time window. Overnight windows such as 20:00 to 07:00
        are supported. Setting both times to the same value means all day.
      default: "23:00:00"
      selector:
        time:

    presence_entities:
      name: Presence entities
      description: >
        Optional entities used by the presence activation modes.
        An entity counts as present when its state is "home" or "on".
        This supports person entities, input booleans, binary sensors
        and other presence logic.
      default: []
      selector:
        entity:
          multiple: true

    sleep_mode_entity:
      name: Sleep mode helper
      description: >
        Optional input_boolean controlled by an iPhone Sleep Focus automation.
        Only used by the presence activation modes (presence, time_and_presence,
        time_or_presence). While at least one presence entity is present and
        this helper is on, the glucose light stays off. Ignored by "always" and
        "time", and when nobody is present. It never switches the light on.
        Leave empty to disable.
      default: []
      selector:
        entity:
          domain: input_boolean

    inactive_behavior:
      name: Behavior while inactive
      description: >
        Turn the light off when activation conditions are not met, or leave its
        current state unchanged.
      default: turn_off
      selector:
        select:
          options:
            - turn_off
            - leave_unchanged

mode: restart

trigger:
  - platform: state
    entity_id: !input glucose_sensor

  - platform: state
    entity_id: !input stale_sensor

  - platform: state
    entity_id: !input presence_entities

  - platform: state
    entity_id: !input sleep_mode_entity

  - platform: time
    at: !input active_start_time

  - platform: time
    at: !input active_end_time

  - platform: homeassistant
    event: start

variables:
  glucose_entity: !input glucose_sensor
  stale_entity: !input stale_sensor

  very_low: !input very_low_threshold
  low: !input low_threshold
  high: !input high_threshold
  very_high: !input very_high_threshold

  color_very_low: !input very_low_color
  color_low: !input low_color
  color_normal: !input normal_color
  color_high: !input high_color
  color_very_high: !input very_high_color
  color_stale: !input stale_color

  normal_mode: !input normal_color_mode
  normal_kelvin: !input normal_color_temp_kelvin

  brightness_very_low: !input very_low_brightness
  brightness_low: !input low_brightness
  brightness_normal: !input normal_brightness
  brightness_high: !input high_brightness
  brightness_very_high: !input very_high_brightness
  brightness_stale: !input stale_brightness

  activation: !input activation_mode
  active_start: !input active_start_time
  active_end: !input active_end_time
  persons: !input presence_entities
  inactive_action: !input inactive_behavior
  sleep_input: !input sleep_mode_entity

  # Home Assistant lets the user pick the display unit of a blood glucose
  # entity, so the state is not necessarily in mmol/L. -1 marks a state that is
  # not a number at all (unknown, unavailable, empty).
  glucose_unit: "{{ state_attr(glucose_entity, 'unit_of_measurement') }}"
  glucose_raw: "{{ states(glucose_entity) | float(-1) }}"
  glucose_usable: >-
    {{ glucose_raw >= 0 and glucose_unit in ['mmol/L', 'mg/dL'] }}
  # Thresholds are mmol/L, so everything is compared in mmol/L. 0 when the
  # reading is unusable; glucose_usable is what decides, never this value.
  #
  # 18.0 and not the 18.0182 used in diabetes care, on purpose: the LibreLinkUp
  # glucose entity is mmol/L natively, and an mg/dL state only exists because
  # Home Assistant converted it for display with a flat factor of 18. What has
  # to be undone here is that conversion, so this factor has to be the same one.
  # With 18.0182 a reading sitting exactly on a threshold came back roughly
  # 0.1 % low and was classified one band more alarming than the identical
  # reading displayed in mmol/L.
  glucose_mmol: >-
    {{ 0 if not glucose_usable else (glucose_raw / 18.0 if glucose_unit == 'mg/dL' else glucose_raw) }}

  # Time window and presence, evaluated once and shared by the activation
  # check and the sleep override.
  time_active: >-
    {% set current = now().strftime('%H:%M:%S') %}
    {% if active_start == active_end %}
      {{ true }}
    {% elif active_start < active_end %}
      {{ active_start <= current < active_end }}
    {% else %}
      {{ current >= active_start or current < active_end }}
    {% endif %}
  # An entity counts as present when its state is "home" or "on".
  person_present: >-
    {% set ns = namespace(present=false) %}
    {% for entity in persons %}
      {% if states(entity) in ['home', 'on'] %}
        {% set ns.present = true %}
      {% endif %}
    {% endfor %}
    {{ ns.present }}
  # Sleep mode only acts while a presence mode is configured and somebody is
  # actually present. It is ignored by "always" and "time", and by a
  # "time_or_presence" activation that comes from the time window alone.
  sleep_override_active: >-
    {% set sleepers = [sleep_input] if sleep_input is string else sleep_input %}
    {{ activation in ['presence', 'time_and_presence', 'time_or_presence']
       and person_present
       and (sleepers | select('is_state', 'on') | list | count > 0) }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% if activation == 'always' %}
                {{ false }}
              {% elif activation == 'time' %}
                {{ not time_active }}
              {% elif activation == 'presence' %}
                {{ not person_present }}
              {% elif activation == 'time_and_presence' %}
                {{ not (time_active and person_present) }}
              {% elif activation == 'time_or_presence' %}
                {{ not (time_active or person_present) }}
              {% else %}
                {{ false }}
              {% endif %}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ inactive_action == 'turn_off' }}"
                sequence:
                  - service: light.turn_off
                    target: !input target_light

    default:
      - choose:
          # Sleep override: see sleep_override_active.
          - conditions:
              - condition: template
                value_template: "{{ sleep_override_active }}"
            sequence:
              - service: light.turn_off
                target: !input target_light

          - conditions:
              - condition: template
                value_template: >-
                  {{ is_state(stale_entity, 'on') or not glucose_usable }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_stale }}"
                  brightness_pct: "{{ brightness_stale }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{ glucose_mmol | float < very_low | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_very_low }}"
                  brightness_pct: "{{ brightness_very_low }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{ glucose_mmol | float < low | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_low }}"
                  brightness_pct: "{{ brightness_low }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{ glucose_mmol | float <= high | float }}
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ normal_mode == 'color_temp' }}"
                    sequence:
                      - service: light.turn_on
                        target: !input target_light
                        data:
                          color_temp_kelvin: "{{ normal_kelvin }}"
                          brightness_pct: "{{ brightness_normal }}"
                default:
                  - service: light.turn_on
                    target: !input target_light
                    data:
                      rgb_color: "{{ color_normal }}"
                      brightness_pct: "{{ brightness_normal }}"

          - conditions:
              - condition: template
                value_template: >-
                  {{ glucose_mmol | float <= very_high | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_high }}"
                  brightness_pct: "{{ brightness_high }}"

        default:
          - service: light.turn_on
            target: !input target_light
            data:
              rgb_color: "{{ color_very_high }}"
              brightness_pct: "{{ brightness_very_high }}"
