blueprint:
  name: LibreLinkUp Glucose Light
  description: >
    Visualize LibreLinkUp glucose values with an RGB light.
    Glucose thresholds, colors, brightness and activation conditions are configurable.
  domain: automation

  input:
    glucose_sensor:
      name: Glucose sensor
      description: LibreLinkUp glucose entity in mmol/L.
      selector:
        entity:
          domain: sensor

    stale_sensor:
      name: Data stale sensor
      description: LibreLinkUp Data Stale binary sensor.
      selector:
        entity:
          domain: binary_sensor

    target_light:
      name: Target light
      description: RGB-capable light used to visualize the glucose state.
      selector:
        target:
          entity:
            domain: light

    very_low_threshold:
      name: Very low threshold
      description: Values below this threshold are shown in the very low color.
      default: 3.0
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    low_threshold:
      name: Low threshold
      description: Values below this threshold are shown in the low color.
      default: 3.9
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    high_threshold:
      name: High threshold
      description: Values up to this threshold are shown in the normal color.
      default: 10.0
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    very_high_threshold:
      name: Very high threshold
      description: Values above the high threshold up to this value use the high color. Higher values use the very high color.
      default: 13.9
      selector:
        number:
          min: 1
          max: 30
          step: 0.1
          unit_of_measurement: mmol/L
          mode: box

    very_low_color:
      name: Very low color
      default: [255, 0, 0]
      selector:
        color_rgb:

    low_color:
      name: Low color
      default: [255, 100, 0]
      selector:
        color_rgb:

    normal_color:
      name: Normal color
      default: [0, 255, 0]
      selector:
        color_rgb:

    high_color:
      name: High color
      default: [255, 200, 0]
      selector:
        color_rgb:

    very_high_color:
      name: Very high color
      default: [180, 0, 255]
      selector:
        color_rgb:

    stale_color:
      name: Stale or unavailable color
      default: [0, 80, 255]
      selector:
        color_rgb:

    brightness:
      name: Brightness
      description: Brightness of the glucose light.
      default: 180
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: slider

    activation_mode:
      name: Activation mode
      description: >
        Choose when the glucose light should be active.
        Presence modes are active when at least one selected person is home.
      default: always
      selector:
        select:
          options:
            - always
            - time
            - presence
            - time_and_presence
            - time_or_presence

    active_start_time:
      name: Active from
      description: Start of the active time window.
      default: "07:00:00"
      selector:
        time:

    active_end_time:
      name: Active until
      description: >
        End of the active time window. Overnight windows such as 20:00 to 07:00 are supported.
      default: "23:00:00"
      selector:
        time:

    presence_entities:
      name: Presence entities
      description: >
        Optional entities used by the presence activation modes.
        An entity counts as present when its state is "home" or "on".
        This supports person entities, input booleans, binary sensors
        and other presence logic.
      default: []
      selector:
        entity:
          multiple: true

    inactive_behavior:
      name: Behavior while inactive
      description: >
        Turn the light off when activation conditions are not met, or leave its current state unchanged.
      default: turn_off
      selector:
        select:
          options:
            - turn_off
            - leave_unchanged

mode: restart

trigger:
  - platform: state
    entity_id: !input glucose_sensor

  - platform: state
    entity_id: !input stale_sensor

  - platform: state
    entity_id: !input presence_entities

  - platform: time
    at: !input active_start_time

  - platform: time
    at: !input active_end_time

  - platform: homeassistant
    event: start

variables:
  glucose_entity: !input glucose_sensor
  stale_entity: !input stale_sensor

  very_low: !input very_low_threshold
  low: !input low_threshold
  high: !input high_threshold
  very_high: !input very_high_threshold

  light_brightness: !input brightness

  color_very_low: !input very_low_color
  color_low: !input low_color
  color_normal: !input normal_color
  color_high: !input high_color
  color_very_high: !input very_high_color
  color_stale: !input stale_color

  activation: !input activation_mode
  active_start: !input active_start_time
  active_end: !input active_end_time
  persons: !input presence_entities
  inactive_action: !input inactive_behavior

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% set current = now().strftime('%H:%M:%S') %}

              {% if active_start <= active_end %}
                {% set time_active = active_start <= current < active_end %}
              {% else %}
                {% set time_active = current >= active_start or current < active_end %}
              {% endif %}

              {% set ns = namespace(presence_active=false) %}
              {% for entity in persons %}
                {% if states(entity) in ['home', 'on'] %}
                  {% set ns.presence_active = true %}
                {% endif %}
              {% endfor %}

              {% if activation == 'always' %}
                {{ false }}
              {% elif activation == 'time' %}
                {{ not time_active }}
              {% elif activation == 'presence' %}
                {{ not ns.presence_active }}
              {% elif activation == 'time_and_presence' %}
                {{ not (time_active and ns.presence_active) }}
              {% elif activation == 'time_or_presence' %}
                {{ not (time_active or ns.presence_active) }}
              {% else %}
                {{ false }}
              {% endif %}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ inactive_action == 'turn_off' }}"
                sequence:
                  - service: light.turn_off
                    target: !input target_light

    default:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state(stale_entity, 'on')
                     or states(glucose_entity) in ['unknown', 'unavailable'] }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_stale }}"
                  brightness: "{{ light_brightness }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states(glucose_entity) | float(999) < very_low | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_very_low }}"
                  brightness: "{{ light_brightness }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states(glucose_entity) | float(999) < low | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_low }}"
                  brightness: "{{ light_brightness }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states(glucose_entity) | float(999) <= high | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_normal }}"
                  brightness: "{{ light_brightness }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states(glucose_entity) | float(999) <= very_high | float }}
            sequence:
              - service: light.turn_on
                target: !input target_light
                data:
                  rgb_color: "{{ color_high }}"
                  brightness: "{{ light_brightness }}"

        default:
          - service: light.turn_on
            target: !input target_light
            data:
              rgb_color: "{{ color_very_high }}"
              brightness: "{{ light_brightness }}"
