name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Home Assistant changes its requirements between releases, so validate on a
    # schedule too, not only when this repository changes.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The action posts its result as a pull request comment by default,
          # which is what the "pull-requests: write" permission above used to be
          # for. The job status carries the same information, so the write
          # permission is given up instead of kept for a comment. On a fork pull
          # request the token is read-only anyway and the comment cannot work.
          comment: "false"
